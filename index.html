function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function buildChildrenBlock(composition) {
  // Парсим тип состава в массив описаний детей
  let kids = [];
  switch(composition.type) {
    case "one_girl": kids = ["дочь"]; break;
    case "one_boy": kids = ["сын"]; break;
    case "two_girls": kids = ["старшая дочь", "младшая дочь"]; break;
    case "two_boys": kids = ["старший сын", "младший сын"]; break;
    case "boy_girl":
      // Случайно выбираем, кто старше
      kids = Math.random() < 0.5
        ? ["старший сын", "младшая дочь"]
        : ["старшая дочь", "младший сын"];
      break;
    case "three_mixed_1": kids = ["старшая дочь", "средняя дочь", "младший сын"]; break;
    case "three_mixed_2": kids = ["старший сын", "средний сын", "младшая дочь"]; break;
    case "three_girls": kids = ["старшая дочь", "средняя дочь", "младшая дочь"]; break;
    case "three_boys": kids = ["старший сын", "средний сын", "младший сын"]; break;
  }
  // Назначаем каждому ребёнку случайный (уникальный) характер
  const usedTraits = new Set();
  return kids.map(k => {
    let trait;
    do { trait = pick(childTraits); } while (usedTraits.has(trait));
    usedTraits.add(trait);
    return `— ${k.charAt(0).toUpperCase() + k.slice(1)}: школьник${k.includes("дочь") ? "ица" : ""}, ${trait}`;
  }).join("\n");
}

function generate() {
  const surname = pick(surnames);
  const husband = pick(husbandJobs);
  const wife = pick(wifeJobs);
  const guest = pick(guests);
  const composition = pick(childComposition);
  const situation = pick(situations);
  const childrenBlock = buildChildrenBlock(composition);
  const weatherChoice = pick(weather);
  const locType = pick(locationTypes);
  const place = pick(locType.source);

  // Формируем естественное описание места
  let placePhrase;
  if (locType.type === "city") {
    placePhrase = `проживающей в городе ${place}`;
  } else {
    placePhrase = `проживающей в ${locType.label === "пригород" ? "пригороде" : (locType.label === "село" ? "селе" : "деревне")}: ${place}`;
  }

  const prompt = `Напиши юмористический рассказ на русском языке о семье ${surname}, ${placePhrase}.

Состав семьи:
— Муж: ${husband}
— Жена: ${wife}
${childrenBlock}
— Гость: ${guest} — приехал погостить

Время года и погода: ${weatherChoice}

Сюжетная завязка: ${situation}

Требования к рассказу:
— Объём: 4000–6000 знаков
— Юмористический тон, но без пошлости
— Обязательно обыграй контраст профессий мужа и жены
— Каждый ребёнок должен проявить свой характер хотя бы раз
— Гость должен внести свой колорит (характерные привычки, лексика, взгляд на быт)
— Погода и место действия должны органично вплестись в сюжет
— Финал — добрый, с тёплой развязкой`;

  document.getElementById('output').value = prompt;
  document.getElementById('info').innerHTML =
    `<b>Выбрано:</b><br>🏠 Фамилия: ${surname}<br>📍 Место: ${locType.label} — ${place}<br>🌦 Погода: ${weatherChoice}<br>👨 Муж: ${husband}<br>👩 Жена: ${wife}<br>👶 Дети: ${composition.description}<br>👴 Гость: ${guest}<br>🎬 Ситуация: ${situation}`;
}

function copyText() {
  const textarea = document.getElementById('output');

  document.execCommand('copy');
  alert('Скопировано в буфер обмена!');
}

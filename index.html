<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор промптов: Юмористические семейные истории</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <header>
            <div class="header-emoji">🎭</div>
            <h1>Генератор промптов</h1>
            <p class="subtitle">Юмористические семейные истории</p>
            <div class="combo-counter" id="comboCounter">Загружаем комбинации...</div>
        </header>

        <main>
            <div class="generator-card">
                <h2>Параметры истории</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="surname">🏠 Фамилия семьи</label>
                        <select id="surname"><option value="">Выберите...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="location">📍 Место действия</label>
                        <select id="location"><option value="">Выберите...</option></select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="husbandJob">👨 Профессия мужа</label>
                        <select id="husbandJob"><option value="">Выберите...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="wifeJob">👩 Профессия жены</label>
                        <select id="wifeJob"><option value="">Выберите...</option></select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="children">👶 Состав детей</label>
                        <select id="children"><option value="">Выберите...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="guest">👴 Гость</label>
                        <select id="guest"><option value="">Выберите...</option></select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="weather">🌦 Погода</label>
                        <select id="weather"><option value="">Выберите...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="length">📏 Длина истории</label>
                        <select id="length">
                            <option value="">Выберите...</option>
                            <option value="Короткая история, объём СТРОГО от 1800 до 2200 слов (НЕ МЕНЕЕ 1800 слов)">Короткая (1800-2200 слов)</option>
                            <option value="Средняя история, объём СТРОГО от 2200 до 2600 слов (НЕ МЕНЕЕ 2200 слов)">Средняя (2200-2600 слов)</option>
                            <option value="Длинная история, объём СТРОГО от 2600 до 3000 слов (НЕ МЕНЕЕ 2600 слов)">Длинная (2600-3000 слов)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="situation">🎬 Сюжетная ситуация</label>
                    <select id="situation"><option value="">Выберите...</option></select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="narrative">⏳ Точка входа в историю</label>
                        <select id="narrative">
                            <option value="">Выберите...</option>
                            <option value="Классическая хронология: история рассказывается от начала до конца — читатель проживает хаос вместе с семьёй">С самого начала (хронология)</option>
                            <option value="С кульминации: рассказ начинается с самого безумного момента, потом — как до этого дошло">С кульминации (как до этого дошло)</option>
                            <option value="Из будущего: рассказчик уже пережил это и вспоминает с усмешкой — «это был худший/лучший день в нашей жизни»">Из будущего (вспоминает с усмешкой)</option>
                            <option value="In medias res: читатель попадает в разгар хаоса — что происходит, непонятно, всё проясняется по ходу">В разгар хаоса (in medias res)</option>
                            <option value="От лица очевидца: сосед, коллега или случайный свидетель рассказывает о том, что видел — взгляд снаружи делает ситуацию вдвойне смешнее">От лица очевидца (взгляд снаружи)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tone">🎙 Тон повествования</label>
                        <select id="tone">
                            <option value="">Выберите...</option>
                            <option value="Лёгкий и искристый: всё происходит быстро, реплики летят как искры, темп нарастает — читатель не успевает отдышаться">Лёгкий и искристый</option>
                            <option value="Тёплый и ностальгический: юмор добрый, немного грустный, «было же время» — читатель улыбается со слезой">Тёплый и ностальгический</option>
                            <option value="Саркастический от первого лица: рассказчик иронизирует над собой и близкими, но с любовью">Саркастический (от первого лица)</option>
                            <option value="Нарастающий абсурд: начинается с обычной жизни, постепенно становится всё безумнее — финал полный сюрреализм">Нарастающий абсурд</option>
                            <option value="Репортажный: как будто журналист описывает семейную катастрофу — сухо, официально, что делает это вдвойне смешнее">Репортажный стиль (сухая официальность)</option>
                        </select>
                    </div>
                </div>
                    <div class="form-group">
                        <label for="twist">🔄 Неожиданный поворот</label>
                        <select id="twist">
                            <option value="">Выберите...</option>
                            <option value="Без поворота: история идёт по нарастающей — сила в деталях и характерах">Без поворота (нарастающий хаос)</option>
                            <option value="Гость оказывается неожиданно полезным: его странный опыт или навык решает неразрешимую проблему">Гость неожиданно спасает ситуацию</option>
                            <option value="Ребёнок всё решает: самый маленький или самый неожиданный член семьи находит выход там, где взрослые провалились">Ребёнок решает всё</option>
                            <option value="Сосед или случайный прохожий становится ключевым персонажем финала">Сосед/прохожий — главный герой финала</option>
                            <option value="Выясняется, что вся ситуация была спровоцирована домашним животным — кот/пёс всё подстроил">Домашнее животное всё подстроило</option>
                            <option value="Муж и жена менялись ролями весь рассказ — и в финале выясняется, что каждый тайно завидовал профессии другого">Муж и жена тайно завидовали друг другу</option>
                            <option value="Хаос случайно приводит к лучшему результату, чем если бы всё пошло по плану">Хаос случайно дал лучший результат</option>
                            <option value="Все всё знали заранее, но молчали — финальное раскрытие взрывает всю историю">Все знали, но молчали</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="title_style">📰 Стиль заголовка</label>
                        <select id="title_style">
                            <option value="">Выберите...</option>
                            <option value="Профессия + катастрофа: заголовок строится на контрасте профессии и нелепой ситуации. Пример: «Хирург с руками-золото починил кран — теперь вода только горячая и только по вторникам»">Профессия + катастрофа</option>
                            <option value="Цитата персонажа как заголовок: самая смешная или нелепая фраза из рассказа выносится в заголовок. Пример: «Папа сказал 'я справлюсь'. Пожарные приехали через 20 минут.»">Цитата персонажа</option>
                            <option value="Обманутые ожидания: заголовок обещает одно, история даёт другое. Пример: «Решили сделать ремонт за выходные» (а он длился полгода)">Обманутые ожидания</option>
                            <option value="Перечисление нарастающего безумия: «Сначала сломался лифт. Потом кот съел торт. Потом приехала тёща.»">Нарастающее перечисление</option>
                            <option value="Вопрос с неочевидным ответом: «Сколько электриков нужно, чтобы сломать новый телевизор?» (Один. Если это мой муж.)">Вопрос с неочевидным ответом</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="symbol">🏆 Комический символ истории</label>
                        <select id="symbol">
                            <option value="">Выберите...</option>
                            <option value="Предмет бытовой техники (пылесос, холодильник, стиральная машина) — ломается в самый неподходящий момент и становится центром хаоса">Сломавшаяся бытовая техника</option>
                            <option value="Торт или блюдо для праздника — которое не получилось, упало, было съедено не теми или стало причиной катастрофы">Праздничный торт/блюдо (катастрофа)</option>
                            <option value="Домашнее животное (кот, пёс, попугай) — невольный виновник всех событий">Домашнее животное — виновник</option>
                            <option value="Подарок или покупка — которая оказалась совсем не тем, чем казалась">Неожиданный подарок/покупка</option>
                            <option value="Инструмент или гаджет, который муж купил и попытался применить">Инструмент/гаджет в руках мужа</option>
                            <option value="Одежда или аксессуар — перепутанный, надетый не так, ставший причиной конфуза">Одежда/аксессуар (конфуз)</option>
                            <option value="Транспорт (машина, велосипед, самокат) — отказавший в самый неподходящий момент">Транспорт (отказал в нужный момент)</option>
                            <option value="Без конкретного символа — юмор в цепи событий и репликах">Без символа (цепь событий)</option>
                        </select>
                    </div>
                </div>

                <div class="buttons">
                    <button id="generateBtn" class="btn btn-primary">✨ Сгенерировать промпт</button>
                    <button id="randomBtn" class="btn btn-secondary">🎲 Случайный выбор</button>
                </div>
            </div>

            <div class="result-card" id="resultCard" style="display: none;">
                <h2>📝 Готовый промпт</h2>
                <div class="selected-info" id="selectedInfo"></div>
                <div class="prompt-output" id="promptOutput"></div>
                <div class="buttons">
                    <button id="copyBtn" class="btn btn-success">📋 Скопировать в буфер</button>
                    <button id="geminiBtn" class="btn btn-gemini">🚀 Открыть в Gemini</button>
                    <button id="claudeBtn" class="btn btn-claude">✦ Открыть в Claude</button>
                </div>
                <p class="copy-status" id="copyStatus"></p>

                <!-- Промпт для изображения -->
                <div class="image-prompt-block">
                    <h3>🖼 Промпт для обложки (Nana Banana 2)</h3>
                    <p class="image-prompt-hint">Скопируйте и вставьте в нейросеть для генерации обложки к рассказу</p>
                    <div class="prompt-output" id="imagePromptOutput"></div>
                    <div class="buttons">
                        <button id="copyImageBtn" class="btn btn-image">🎨 Скопировать промпт для обложки</button>
                    </div>
                    <p class="copy-status" id="copyImageStatus"></p>
                </div>
            </div>
        </main>

        <footer>
            <p>Генератор промптов для юмористических семейных историй © 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>

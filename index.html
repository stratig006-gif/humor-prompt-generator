<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор промптов: Юмористические семейные истории</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="container">
        <header>
            <div class="header-emoji">🎭</div>
            <h1>Генератор промптов</h1>
            <p class="subtitle">Юмористические семейные истории</p>
            <div class="combo-counter" id="comboCounter">Загружаем комбинации...</div>
        </header>

        <main>
            <div class="generator-card">
                <h2>Параметры истории</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="surname">🏠 Фамилия семьи</label>
                        <select id="surname"><option value="">Выберите...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="location">📍 Место действия</label>
                        <select id="location"><option value="">Выберите...</option></select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="husbandJob">👨 Профессия мужа</label>
                        <select id="husbandJob"><option value="">Выберите...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="wifeJob">👩 Профессия жены</label>
                        <select id="wifeJob"><option value="">Выберите...</option></select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="children">👶 Состав детей</label>
                        <select id="children"><option value="">Выберите...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="guest">👴 Гость</label>
                        <select id="guest"><option value="">Выберите...</option></select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="weather">🌦 Погода</label>
                        <select id="weather"><option value="">Выберите...</option></select>
                    </div>
                    <div class="form-group">
                        <label for="length">📏 Длина истории</label>
                        <select id="length">
                            <option value="">Выберите...</option>
                            <option value="Короткая история, объём СТРОГО от 1800 до 2200 слов (НЕ МЕНЕЕ 1800 слов)">Короткая (1800-2200 слов)</option>
                            <option value="Средняя история, объём СТРОГО от 2200 до 2600 слов (НЕ МЕНЕЕ 2200 слов)">Средняя (2200-2600 слов)</option>
                            <option value="Длинная история, объём СТРОГО от 2600 до 3000 слов (НЕ МЕНЕЕ 2600 слов)">Длинная (2600-3000 слов)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="situation">🎬 Сюжетная ситуация</label>
                    <select id="situation"><option value="">Выберите...</option></select>
                </div>

                <div class="buttons">
                    <button id="generateBtn" class="btn btn-primary">✨ Сгенерировать промпт</button>
                    <button id="randomBtn" class="btn btn-secondary">🎲 Случайный выбор</button>
                </div>
            </div>

            <div class="result-card" id="resultCard" style="display: none;">
                <h2>📝 Готовый промпт</h2>
                <div class="selected-info" id="selectedInfo"></div>
                <div class="prompt-output" id="promptOutput"></div>
                <div class="buttons">
                    <button id="copyBtn" class="btn btn-success">📋 Скопировать в буфер</button>
                    <button id="geminiBtn" class="btn btn-gemini">🚀 Открыть в Gemini</button>
                    <button id="claudeBtn" class="btn btn-claude">✦ Открыть в Claude</button>
                </div>
                <p class="copy-status" id="copyStatus"></p>

                <!-- Промпт для изображения -->
                <div class="image-prompt-block">
                    <h3>🖼 Промпт для обложки (Nana Banana 2)</h3>
                    <p class="image-prompt-hint">Скопируйте и вставьте в нейросеть для генерации обложки к рассказу</p>
                    <div class="prompt-output" id="imagePromptOutput"></div>
                    <div class="buttons">
                        <button id="copyImageBtn" class="btn btn-image">🎨 Скопировать промпт для обложки</button>
                    </div>
                    <p class="copy-status" id="copyImageStatus"></p>
                </div>
            </div>
        </main>

        <footer>
            <p>Генератор промптов для юмористических семейных историй © 2026</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
